[build]
  command = "npm run build"
  functions = "netlify/functions"
  publish = "dist"

[functions]
  node_bundler = "esbuild"

# API routes go to the function
[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200

# Admin panel is generated by Astro at /admin/
[[redirects]]
  from = "/admin"
  to = "/admin/"
  status = 301